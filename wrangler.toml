name = "twilight-cloud-githubhosts-2037"
main = "src/index.ts"
compatibility_date = "2024-10-28"
compatibility_flags = ["nodejs_compat"]
assets = { directory = "public" }

[vars]
# Raw URL to domains.txt in the GitHub repository. Replace <owner> and <repo> as needed.
DOMAINS_URL = "https://raw.githubusercontent.com/aspnmy/github-hosts/nokv/domains.txt"
API_KEY = ""

# [[r2_buckets]]
# binding = "MY_BUCKET"
# bucket_name = "my-bucket"

# [[d1_databases]]
# binding = "DB"
# database_name = "my-database"
# database_id = ""

# [ai]
# binding = "AI"

[observability]
enabled = true
head_sampling_rate = 1
