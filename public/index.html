<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>GitHub Hosts - 自动更新</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: -apple-system, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
    pre { background: #f5f5f5; padding: 16px; border-radius: 8px; overflow-x: auto; }
    a { color: #0366d6; }
  </style>
</head>
<body>
  <h1>GitHub Hosts</h1>
  <p>自动解析域名 DNS 并生成 hosts 文件，每 8 小时更新一次。</p>
  <h2>使用方法</h2>
  <p><strong>SwitchHosts:</strong> <code>https://aspnmy.github.io/github-hosts/hosts.txt</code></p>
  <p><strong>手动下载:</strong> <a href="hosts.txt">hosts.txt</a></p>
  <h2>当前状态</h2>
  <pre id="status">加载中...</pre>
  <script>
    fetch('hosts.txt').then(r=>r.text()).then(t=>{
      const lines = t.split('\n').filter(l => l.startsWith('#'));
      document.getElementById('status').textContent = lines.join('\n') || '无数据';
    });
  </script>
</body>
</html>
