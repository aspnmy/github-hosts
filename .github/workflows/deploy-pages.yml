name: Deploy to GitHub Pages

on:
  push:
    branches: [actions-deploy]
    paths: ['domains.txt', 'CNAME']
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  resolve-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: actions-deploy

      - name: DNS Resolve
        run: |
          mkdir -p dist
          echo "# GitHub Hosts - Auto Generated" > dist/hosts.txt
          echo "# Updated: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')" >> dist/hosts.txt
          echo "# Total domains: $(wc -l < domains.txt)" >> dist/hosts.txt
          echo "" >> dist/hosts.txt
          while IFS= read -r domain; do
            [ -z "$domain" ] && continue
            ip=$(dig +short @1.1.1.1 "$domain" 2>/dev/null | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' | grep -v '^127\.' | head -1)
            [ -n "$ip" ] && printf "%-25s %s\n" "$ip" "$domain" >> dist/hosts.txt
          done < domains.txt
          cp CNAME dist/

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          keep_files: false
          cname: myhosts.earth-online.org
