name: Build Binaries and Upload Artifacts

on:
  push:
    branches: [ nokv ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'

      - name: Build binaries (scripts)
        working-directory: ./scripts
        run: |
          set -e
          # Ensure build directory
          mkdir -p build
          # Windows
          GOOS=windows GOARCH=amd64 go build -ldflags='-s -w -X main.Version=${{ github.ref_name || "dev" }}' -o ../build/github-hosts.windows-amd64.exe .
          GOOS=windows GOARCH=386   go build -ldflags='-s -w -X main.Version=${{ github.ref_name || "dev" }}' -o ../build/github-hosts.windows-386.exe .
          # macOS
          GOOS=darwin GOARCH=amd64  go build -ldflags='-s -w -X main.Version=${{ github.ref_name || "dev" }}' -o ../build/github-hosts.darwin-amd64 .
          GOOS=darwin GOARCH=arm64  go build -ldflags='-s -w -X main.Version=${{ github.ref_name || "dev" }}' -o ../build/github-hosts.darwin-arm64 .
          # Linux
          GOOS=linux GOARCH=amd64   go build -ldflags='-s -w -X main.Version=${{ github.ref_name || "dev" }}' -o ../build/github-hosts.linux-amd64 .
          GOOS=linux GOARCH=386     go build -ldflags='-s -w -X main.Version=${{ github.ref_name || "dev" }}' -o ../build/github-hosts.linux-386 .
          GOOS=linux GOARCH=arm64   go build -ldflags='-s -w -X main.Version=${{ github.ref_name || "dev" }}' -o ../build/github-hosts.linux-arm64 .

      - name: Zip artifacts
        run: |
          cd build
          for f in *; do zip -j "${f}.zip" "$f"; done
        shell: bash

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: github-hosts-binaries
          path: build/
