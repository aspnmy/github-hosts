name: Build Binaries and Upload Artifacts

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ nokv ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Build binaries
        working-directory: ./scripts
        run: |
          set -e
          # 从项目根目录的 .version 文件读取版本号并注入到二进制中
          VERSION=$(tr -d '[:space:]' < ../.version)
          echo "构建版本: $VERSION"
          mkdir -p ../build
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w -X main.Version=$VERSION" -o ../build/github-hosts.windows-amd64.exe .
          GOOS=windows GOARCH=386   go build -ldflags="-s -w -X main.Version=$VERSION" -o ../build/github-hosts.windows-386.exe .
          GOOS=darwin  GOARCH=amd64 go build -ldflags="-s -w -X main.Version=$VERSION" -o ../build/github-hosts.darwin-amd64 .
          GOOS=darwin  GOARCH=arm64 go build -ldflags="-s -w -X main.Version=$VERSION" -o ../build/github-hosts.darwin-arm64 .
          GOOS=linux   GOARCH=amd64 go build -ldflags="-s -w -X main.Version=$VERSION" -o ../build/github-hosts.linux-amd64 .
          GOOS=linux   GOARCH=386   go build -ldflags="-s -w -X main.Version=$VERSION" -o ../build/github-hosts.linux-386 .
          GOOS=linux   GOARCH=arm64 go build -ldflags="-s -w -X main.Version=$VERSION" -o ../build/github-hosts.linux-arm64 .

      - name: Zip artifacts
        run: |
          cp scripts/github_hosts.sh build/
          cd build
          for f in *; do zip -j "${f}.zip" "$f"; done
          find . -maxdepth 1 -type f ! -name "*.zip" -delete
        shell: bash

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: github-hosts-binaries
          path: build/*.zip
