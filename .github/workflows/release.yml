name: Release Go Binaries

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Build binaries
        working-directory: ./scripts
        run: |
          set -e
          mkdir -p ../build
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o ../build/github-hosts.windows-amd64.exe .
          GOOS=windows GOARCH=386   go build -ldflags="-s -w" -o ../build/github-hosts.windows-386.exe .
          GOOS=darwin  GOARCH=amd64 go build -ldflags="-s -w" -o ../build/github-hosts.darwin-amd64 .
          GOOS=darwin  GOARCH=arm64 go build -ldflags="-s -w" -o ../build/github-hosts.darwin-arm64 .
          GOOS=linux   GOARCH=amd64 go build -ldflags="-s -w" -o ../build/github-hosts.linux-amd64 .
          GOOS=linux   GOARCH=386   go build -ldflags="-s -w" -o ../build/github-hosts.linux-386 .
          GOOS=linux   GOARCH=arm64 go build -ldflags="-s -w" -o ../build/github-hosts.linux-arm64 .

      - name: Zip artifacts
        run: |
          cp scripts/github_hosts.sh build/
          cd build
          for f in *; do zip -j "${f}.zip" "$f"; done
          rm -f *.exe github-hosts.darwin-* github-hosts.linux-* github_hosts.sh
        shell: bash

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.zip
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
