name: Release Go Binaries

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Create Release from build-artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq unzip

      - name: Find latest build-artifacts workflow run for this commit
        id: find_run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner_repo="${GITHUB_REPOSITORY}"
          owner=${GITHUB_REPOSITORY%%/*}
          repo=${GITHUB_REPOSITORY#*/}
          # Get workflow id for build-artifacts.yml
          wf=$(curl -s -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/$owner/$repo/actions/workflows/build-artifacts.yml")
          wf_id=$(echo "$wf" | jq -r .id)
          if [ -z "$wf_id" ] || [ "$wf_id" = "null" ]; then
            echo "No build-artifacts workflow found" >&2
            exit 1
          fi
          # Try to find a run with same head_sha
          runs=$(curl -s -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/$owner/$repo/actions/workflows/$wf_id/runs?per_page=50")
          run_id=$(echo "$runs" | jq -r --arg sha "$GITHUB_SHA" '.workflow_runs[] | select(.head_sha==$sha) | .id' | head -n1)
          if [ -z "$run_id" ]; then
            # fallback: pick latest completed run
            run_id=$(echo "$runs" | jq -r '.workflow_runs[] | select(.conclusion=="success") | .id' | head -n1)
          fi
          if [ -z "$run_id" ]; then
            echo "No suitable build-artifacts run found" >&2
            exit 1
          fi
          echo "run_id=$run_id" >> $GITHUB_OUTPUT

      - name: Download artifacts from run
        id: download_artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_id=${{ steps.find_run.outputs.run_id }}
          mkdir -p build
          echo "Listing artifacts for run $run_id"
          artifacts=$(curl -s -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/$run_id/artifacts")
          echo "$artifacts" | jq -r '.artifacts[] | .archive_download_url' | while read url; do
            echo "Downloading $url"
            curl -L -H "Authorization: token $GITHUB_TOKEN" -o /tmp/art.zip "$url"
            unzip -o /tmp/art.zip -d build
          done

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/**
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
